<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes App</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f5f7;
      margin: 0;
      padding: 40px 20px;
      color: #1a1a1a;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 4px;
    }
    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 24px;
    }
    form {
      background: #ffffff;
      border: 1px solid #e2e4e8;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #333;
    }
    input[type="text"],
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      margin-bottom: 16px;
      resize: vertical;
    }
    textarea {
      min-height: 90px;
    }
    input[type="text"]:focus,
    textarea:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
    }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .note-card {
      background: #ffffff;
      border: 1px solid #e2e4e8;
      border-radius: 8px;
      padding: 16px;
      position: relative;
    }
    .note-title {
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 6px 0;
    }
    .note-content {
      font-size: 14px;
      color: #444;
      white-space: pre-wrap;
      margin: 0 0 10px 0;
    }
    .note-meta {
      font-size: 12px;
      color: #999;
    }
    .delete-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: transparent;
      color: #dc2626;
      border: 1px solid #f3c4c4;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 5px;
    }
    .delete-btn:hover {
      background: #fee2e2;
    }
    .empty-state {
      color: #888;
      font-size: 14px;
      text-align: center;
      padding: 30px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Notes App</h1>
    <p class="subtitle">Simple notes backed by /api/notes</p>

    <form id="note-form">
      <label for="title">Title</label>
      <input type="text" id="title" placeholder="Note title" required>

      <label for="content">Content</label>
      <textarea id="content" placeholder="Write your note..."></textarea>

      <button type="submit">Add Note</button>
    </form>

    <div id="notes-list" class="notes-list">
      <p class="empty-state">Loading notes...</p>
    </div>
  </div>

  <script>
    const form = document.getElementById('note-form');
    const titleInput = document.getElementById('title');
    const contentInput = document.getElementById('content');
    const notesList = document.getElementById('notes-list');

    async function loadNotes() {
      try {
        const res = await fetch('/api/notes');
        const notes = await res.json();

        if (!notes.length) {
          notesList.innerHTML = '<p class="empty-state">No notes yet. Add one above.</p>';
          return;
        }

        notesList.innerHTML = notes.map(note => `
          <div class="note-card">
            <button class="delete-btn" onclick="deleteNote('${note.id}')">Delete</button>
            <p class="note-title">${escapeHtml(note.title)}</p>
            <p class="note-content">${escapeHtml(note.content || '')}</p>
            <p class="note-meta">${note.created_at ? new Date(note.created_at).toLocaleString() : ''}</p>
          </div>
        `).join('');
      } catch (err) {
        notesList.innerHTML = '<p class="empty-state">Could not load notes.</p>';
        console.error(err);
      }
    }

    async function deleteNote(id) {
      await fetch(`/api/notes/${id}`, { method: 'DELETE' });
      loadNotes();
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = titleInput.value.trim();
      const content = contentInput.value.trim();
      if (!title) return;

      await fetch('/api/notes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, content })
      });

      titleInput.value = '';
      contentInput.value = '';
      loadNotes();
    });

    loadNotes();
  </script>
</body>
</html>
