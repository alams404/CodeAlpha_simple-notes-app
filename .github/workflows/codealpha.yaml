# Run automatically when cold is pusshed
name: Build and Deploy to Azure
on:
  push:
    branches:
      - main
  workflow_dispatch:

# must match image name in variable.tf
env:
  IMAGE_NAME: codealpha-simple-notes-app
  ACR_NAME: ${{ secrets.ACR_NAME }}
  WEBAPP_NAME: ${{ secrets.WEBAPP_NAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS}}

      - name: Log in to Azure container registry
        
        run: |
          ACR_USER=$(az acr credential show --name "$ACR_NAME" --query username -o tsv)
          ACR_PASS=$(az acr credential show --name "$ACR_NAME" --query "passwords[0].value" -o tsv)
          echo "::add-mask::$ACR_PASS"
          echo "$ACR_PASS" | docker login "$ACR_NAME.azurecr.io" -u "$ACR_USER" --password-stdin

      - name: Build and push image
        run: |
          IMAGE="$ACR_NAME.azurecr.io/$IMAGE_NAME"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy to azure web app
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.WEBAPP_NAME }}
          images: ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: check the site
        run: |
          URL="https://$WEBAPP_NAME.azurewebsites.net"
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)
            echo "Attempt $i: HTTP status $CODE"
            if [ "$CODE" = "200" ]; then
              echo "live at $URL"
              exit 0
            fi
            sleep 20
          done
          echo "site did not return 200 yet. open the web App Log stream in the Azure portal."
  
          

